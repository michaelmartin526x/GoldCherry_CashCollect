<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Gold Cherry Cash Collect - v0.1.18</title><link rel="stylesheet" href="style.css"></head><body>

<main id="game">

<img id="bg" src="assets/Background.png"><img id="free-bg" src="assets/free/FreeSpins_Background.png"><img id="logo" src="assets/Logo.png">

<div id="wheel-shell"><img id="wheel-rotor" src="assets/BaseWheel.png" alt="Wild wheel"><img id="wheel-blur" src="assets/BaseWheel_blur.png" alt=""><img id="wheel-frame" src="assets/WildWheel_Frame.png" alt=""><img id="wheel-pointer" src="assets/Ticker.png" alt="Selected wheel segment"></div><div id="collect-target" hidden></div><section id="reel-shell"><img id="reel-bg" src="assets/Reelframe_Background.png"><div id="three"><div id="reel-window"></div><div id="fx-layer"></div></div><img id="reel-frame" src="assets/Reelframe.png"></section>

<div id="feature-hud"><span>FREE SPINS <b id="free-left">0</b></span><span>FEATURE WIN <b id="feature-win">0.00</b></span></div>

<div id="status">GOOD LUCK!</div><button id="settings" class="side-button" aria-label="Settings"><img src="assets/button_settings_on.png"></button><button id="spin" aria-label="Spin"><img src="assets/button_play_on.png"></button><button id="autoplay" class="side-button" aria-label="Autoplay"><img src="assets/button_autoplay_on.png" alt="AUTOPLAY"></button><div id="account-bar"><div class="account stake"><small>STAKE</small><b id="stake">1.00</b></div><div class="account win"><small>WIN</small><b id="win">0.00</b></div><div class="account credit"><small>CREDIT</small><b id="credit">1,000.00</b></div></div><div id="version">THREE.JS + SPINE PROTOTYPE · v0.1.18</div>

<div id="splash" class="screen active"><img class="splash-bg" src="assets/Background.png"><img class="splash-game-logo" src="assets/Logo.png"><img class="splash-info-01" src="assets/splash/Game_info_01.png"><img class="splash-info-02" src="assets/splash/Game_info_02.png"><img class="press-anywhere" src="assets/splash/PressAnywhere_info.png"></div>

<div id="feature-entry" class="screen"><img id="feature-entry-panel" class="feature-panel" src="assets/free/Enter_FreeSpins_Panel_5.png"><img class="feature-press" src="assets/splash/PressAnywhere_info.png"></div>

<div id="feature-complete" class="screen"><div class="complete-wrap"><img class="feature-panel" src="assets/free/Win_FreeSpins_Panel.png"><div id="feature-total">0.00</div></div><img class="feature-press" src="assets/splash/PressAnywhere_info.png"></div>

<aside id="debug"><div id="debug-title">RESULT INSPECTOR · v0.1.18</div><label>Test wheel mode <select id="debug-mode"><option value="D">D - Scatter entry only</option><option value="A">A - Wild</option><option value="B">B - No award</option><option value="C">C - Cash collect</option><option value="E">E - Cash collect</option></select></label><button id="debug-mode-spin" type="button">Run selected mode (test only)</button><label>Forced feature wheel mode <select id="debug-feature-mode"><option value="">Script weights</option><option value="FA">FA - Cash collect</option><option value="FB">FB - Wild</option><option value="FC">FC - No award</option><option value="FD">FD - Double prizes</option></select></label><button id="debug-feature" type="button">Force feature (test only)</button><pre id="debug-content">Press anywhere to start.</pre></aside>
